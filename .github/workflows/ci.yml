name: cpu
on: [push, pull_request]
jobs:
  # Lint, the tests, and the notebook that recomputes the committed numbers from the
  # committed per-task records. No GPU, no model and no benchmark download.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/run_notebook.py
      - run: uv run python scripts/metatime/report.py > /dev/null
