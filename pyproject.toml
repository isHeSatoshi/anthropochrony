[project]
name = "anthropochrony"
version = "0.2.0"
description = "A small model taught to estimate its own running time, scored on the public MetaTime benchmark."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
# CPU side only: scoring, tables, figure and tests. The GPU scripts (training, timed runs,
# estimates) also need PyTorch and peft; see docs/METATIME.md.
dependencies = [
  "PyYAML==6.0.3",
  "numpy==2.4.6",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.10,<4",
  "pandas>=2.2,<4",
  "pyarrow>=24,<25",
  "huggingface-hub==2.4.0",
  "transformers==5.21.1",
  "onnxruntime>=1.24,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
