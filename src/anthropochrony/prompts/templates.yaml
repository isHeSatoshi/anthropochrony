system: 'You are a Python coding agent.

  How a run works: you read the task and write a complete solution, then the harness runs the task''s tests. If
  a test fails, you see the failure and write a corrected full solution. You get at most 3 attempts. The run ends
  when the tests pass or after your third attempt.

  A run''s time counts from when you start reading the task until the last test run finishes, whether or not the
  tests pass.

  {speed_card}'
task: 'Task:

  {spec}


  Write the complete solution in Python in one ```python code block.'
feedback: 'The tests failed (attempt {j} of 3).

  {failure_summary}


  Reply with the complete corrected solution in one ```python code block.'
target: 'About {T} (likely {LO}–{HI}). Breakdown: ~{TOK} output tokens at {S} tok/s ≈ {GEN}{OVH}; {ATT}. First-attempt
  pass chance: {PFP}.'
example: 'About 30 s (likely 20–55 s). Breakdown: ~900 output tokens at 35 tok/s ≈ 26 s, plus ~4.3 s reading the
  task and running tests; 1 attempt expected. First-attempt pass chance: about 70%.'
teacher: 'You are predicting the behavior of a specific small AI coding agent on a task. Do not solve the task.

  Agent: Tiny Aya Global, an open 3.35B-parameter multilingual chat model, temperature 0.1.

  Harness: the agent writes a complete Python solution; tests run; on failure it sees the failure and rewrites the
  full solution; at most 3 attempts; it stops when tests pass.

  Task given to the agent:

  <<<

  {task_turn}

  >>>

  Predict for this agent on this task:

  - tokens_median: total output tokens across all attempts (median over repeated runs)

  - tokens_p10, tokens_p90: 10th and 90th percentile of that total

  - attempts_median: 1, 2 or 3

  - p_first_pass: probability its first attempt passes all tests

  - test_seconds: wall time of one test run

  Reply with JSON only: {"tokens_median": int, "tokens_p10": int, "tokens_p90": int, "attempts_median": int, "p_first_pass":
  float, "test_seconds": float}'
synthetic: 'Create one self-contained Python programming task of the "small project" kind.

  Category: {category}. Difficulty: {difficulty} (target reference size: {lines} lines).

  Constraints: Python 3.10 standard library only; everything in one module named solution.py; deterministic; no
  network, no sleeping, no reading files outside a pytest tmp_path; all tests must finish in under 5 seconds.

  Return exactly three sections:

  <spec>A clear task description for a developer (what to build, public functions/classes with signatures, behaviors,
  edge cases). Do not include the implementation.</spec>

  <reference>The complete reference solution.py.</reference>

  <tests>A pytest file (8 to 15 tests) that imports from solution and checks the spec''d behavior.</tests>'
judge: 'Extract the time estimate from an answer. The answer replies to the question shown.

  Question: {question}

  Answer: <<<{answer}>>>

  Rules: If a range is given, lo and hi are its ends and point is their geometric mean. If only per-step durations
  are given, sum them. Convert with 1 day = 8 h, 1 week = 40 h, 1 month = 160 h. If no duration is stated, has_estimate
  is false.

  Return JSON only: {"has_estimate": bool, "point_seconds": number|null, "lo_seconds": number|null, "hi_seconds":
  number|null, "units_used": [string], "referent": "self"|"human"|"generic_ai"|"unclear"}'
